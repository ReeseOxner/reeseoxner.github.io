<!--
  Inline HTML + JavaScript UTM Link Generator
  Paste this into an .html file and open in your browser.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UTM Link Generator</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 2rem;
    }
    .container {
      display: flex;
      gap: 2rem;
      max-width: 1200px;
      margin: auto;
    }
    .side {
      flex: 1;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      padding: 1.5rem;
      min-width: 0;
    }
    textarea {
      width: 100%;
      min-height: 350px;
      font-size: 1rem;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: vertical;
      box-sizing: border-box;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .link-row {
      display: flex;
      align-items: center;
      margin-bottom: 1rem;
      background: #f9f9f9;
      padding: 0.75rem;
      border-radius: 8px;
      word-break: break-all;
    }
    .link-row span {
      flex: 1;
      margin-right: 1rem;
    }
    .copy-btn {
      padding: 0.5rem 1rem;
      border-radius: 4px;
      border: none;
      background: #007bff;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
    }
    .copy-btn:active {
      background: #0056b3;
    }
    .invalid {
      color: red;
      background: #fff0f0;
    }
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="side">
      <h2>Paste your links</h2>
      <textarea id="inputLinks" placeholder="Paste one link per line"></textarea>
    </div>
    <div class="side">
      <h2>Links with UTM codes</h2>
      <ul id="outputLinks"></ul>
    </div>
  </div>
  <script>
    const UTM_PARAMS = [
      { key: "utm_source", value: "linkedin" },
      { key: "utm_medium", value: "linkedin_newsletter" },
      { key: "utm_content", value: "GoodJob" },
      { key: "utm_campaign", value: "linkedin_newsletter" },
    ];

    function appendUTM(url) {
      try {
        const urlObj = new URL(url.trim());
        UTM_PARAMS.forEach(param => {
          urlObj.searchParams.set(param.key, param.value);
        });
        return urlObj.toString();
      } catch (e) {
        return ""; // Invalid URL
      }
    }

    function renderLinks() {
      const input = document.getElementById('inputLinks').value;
      const lines = input.split('\n').map(line => line.trim()).filter(line => line.length > 0);
      const output = document.getElementById('outputLinks');
      output.innerHTML = '';
      lines.forEach((link, idx) => {
        const utmLink = appendUTM(link);
        const li = document.createElement('li');
        li.className = 'link-row';
        if (!utmLink) {
          li.classList.add('invalid');
          li.textContent = 'Invalid URL: ' + link;
        } else {
          const span = document.createElement('span');
          span.textContent = utmLink;
          li.appendChild(span);

          const btn = document.createElement('button');
          btn.textContent = 'COPY';
          btn.className = 'copy-btn';
          btn.onclick = function() {
            if (navigator.clipboard) {
              navigator.clipboard.writeText(utmLink).then(() => {
                btn.textContent = 'COPIED!';
                setTimeout(() => { btn.textContent = 'COPY'; }, 1000);
              }, () => {
                alert('Failed to copy');
              });
            } else {
              // fallback for older browsers
              const temp = document.createElement('input');
              temp.value = utmLink;
              document.body.appendChild(temp);
              temp.select();
              try {
                document.execCommand('copy');
                btn.textContent = 'COPIED!';
                setTimeout(() => { btn.textContent = 'COPY'; }, 1000);
              } catch (err) {
                alert('Failed to copy');
              }
              document.body.removeChild(temp);
            }
          };
          li.appendChild(btn);
        }
        output.appendChild(li);
      });
    }

    document.getElementById('inputLinks').addEventListener('input', renderLinks);

    // Optionally, render once on load if textarea has content
    renderLinks();
  </script>
</body>
</html>
